// === STATISTICS ===
function renderStats(){
  const sec=$('#view-stats');sec.innerHTML='';
  const d=state.data;const today=todayKey();
  const dayHabits=d.checklist.days[today]||{};
  const items=d.checklist.items;
  const habitsDone=items.filter(it=>dayHabits[it.id]).length;
  const habitsTotal=items.length;
  const tasksDone=d.tasks.filter(t=>t.completedAt&&t.completedAt.slice(0,10)===today).length;
  const tasksTotal=d.tasks.filter(t=>!t.archived).length;
  const pomoDayMin=d.pomodoro.sessions.filter(s=>s.date===today).reduce((sum,s)=>sum+s.minutes,0);
  const kayzenToday=!!(d.kayzen.entries[today]&&Object.values(d.kayzen.entries[today]).some(v=>v.trim()));
  // Today summary
  sec.appendChild(el(`<div class="stats-section">
    <h3>Bugungi xulosa</h3>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">Chek list</div><div class="value">${habitsDone}/${habitsTotal}</div><div class="sub">${habitsTotal?Math.round(habitsDone/habitsTotal*100):0}%</div></div>
      <div class="stat-card"><div class="label">Vazifalar</div><div class="value">${tasksDone}</div><div class="sub">ta bajarildi</div></div>
      <div class="stat-card"><div class="label">Pomodoro</div><div class="value">${pomoDayMin}</div><div class="sub">daqiqa fokus</div></div>
      <div class="stat-card"><div class="label">Kayzen</div><div class="value">${kayzenToday?'✓':'✗'}</div><div class="sub">yozildi</div></div>
    </div>
  </div>`));

  // Weekly chart
  const sec2=el(`<div class="stats-section"><h3>Haftalik statistika</h3><div class="card"><canvas id="weekly-chart" height="160"></canvas></div></div>`);
  sec.appendChild(sec2);

  // Monthly heatmap
  const heatDiv=el(`<div class="stats-section"><h3>Oylik heatmap</h3><div class="heatmap" id="heatmap"></div><div class="heatmap-legend"><span class="swatch" style="background:var(--surface-3)"></span>0%<span class="swatch" style="background:#BBF7D0;margin-left:6px"></span>1-50%<span class="swatch" style="background:#16A34A;margin-left:6px"></span>51-100%</div></div>`);
  sec.appendChild(heatDiv);

  // Habit stats
  const habStatSec=el(`<div class="stats-section"><h3>Odat darajalari</h3><div id="habit-stats-list"></div></div>`);
  sec.appendChild(habStatSec);

  // Achievements
  const achSec=el(`<div class="stats-section"><h3>Yutuqlar</h3></div>`);
  sec.appendChild(achSec);

  // Render weekly chart
  setTimeout(()=>{
    const labels=[];const data=[];
    for(let i=6;i>=0;i--){
      const d2=addDays(new Date(),-i);const k=dateKey(d2);
      labels.push(formatDateShort(d2));
      const dd=d.checklist.days[k]||{};const cnt=items.filter(it=>dd[it.id]).length;
      data.push(habitsTotal?Math.round(cnt/habitsTotal*100):0);
    }
    const ctx=$('#weekly-chart');if(!ctx)return;
    if(state.charts.weekly){state.charts.weekly.destroy()}
    state.charts.weekly=new Chart(ctx,{
      type:'bar',
      data:{labels,datasets:[{label:'Bajarilish %',data,backgroundColor:'#DBEAFE',borderColor:'#2563EB',borderWidth:2,borderRadius:6}]},
      options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{min:0,max:100,ticks:{callback:v=>v+'%'}}}}
    });

    // Heatmap
    const hm=$('#heatmap');if(!hm)return;hm.innerHTML='';
    const now=new Date();
    for(let i=29;i>=0;i--){
      const dd=addDays(now,-i);const k=dateKey(dd);
      const dd2=d.checklist.days[k]||{};const cnt=items.filter(it=>dd2[it.id]).length;
      const pct2=habitsTotal?cnt/habitsTotal:0;
      const bg=pct2===0?'var(--surface-3)':pct2<0.5?`rgba(187,247,208,${0.5+pct2})`:'#16A34A';
      const cell=el(`<div class="heatmap-cell" style="background:${bg}" title="${formatDateShort(dd)}: ${Math.round(pct2*100)}%"></div>`);
      cell.onclick=()=>{state.currentDate=k;switchView('checklist')};
      hm.appendChild(cell);
    }

    // Habit stats
    const hsl=$('#habit-stats-list');if(!hsl)return;
    items.forEach(it=>{
      let cnt30=0;let streak=0;let maxStreak=0;let cur=0;
      for(let i=29;i>=0;i--){
        const dd=addDays(new Date(),-i);const k=dateKey(dd);
        const done=!!(d.checklist.days[k]&&d.checklist.days[k][it.id]);
        if(done){cnt30++;cur++}else{if(cur>maxStreak)maxStreak=cur;cur=0}
      }
      if(cur>maxStreak)maxStreak=cur;
      // Current streak
      let dCur=new Date();let slimit=0;while(slimit<365){slimit++;const k=dateKey(dCur);const done=!!(d.checklist.days[k]&&d.checklist.days[k][it.id]);if(!done)break;streak++;dCur.setDate(dCur.getDate()-1)}
      const pct30=Math.round(cnt30/30*100);
      const row=el(`<div class="habit-stat-row">
        <div class="habit-stat-head"><span class="emoji">${it.emoji}</span><span class="name">${esc(it.name)}</span><span class="pct">${pct30}%</span></div>
        <div class="bar"><div class="bar-fill" style="width:${pct30}%"></div></div>
        <div class="habit-stat-meta"><span>🔥 Joriy streak: ${streak}</span><span>🏆 Eng uzun: ${maxStreak}</span></div>
      </div>`);
      hsl.appendChild(row);
    });

    // Achievements
    const totalDone=d.tasks.filter(t=>t.completed).length;
    const achData=[
      {icon:'🌟',name:'Birinchi hafta',desc:'7 kun ketma-ket 100% odat',unlocked:calcStreak()>=7},
      {icon:'💪',name:"Mustahkam odat",desc:'30 kun streak',unlocked:calcStreak()>=30},
      {icon:'✅',name:'100 vazifa',desc:'100 ta vazifani bajardim',unlocked:totalDone>=100},
    ];
    achData.forEach(a=>{
      achSec.appendChild(el(`<div class="achievement${a.unlocked?'':' locked'}">
        <div class="ach-icon">${a.icon}</div>
        <div class="ach-info"><div class="ach-name">${a.name}</div><div class="ach-desc">${a.desc}${a.unlocked?' ✓':''}</div></div>
      </div>`));
    });
  },100);
}

function initPomo(){
  state.pomo={running:false,mode:'work',secondsLeft:state.data.pomodoro.workMin*60,taskId:null,sessionCount:0,intervalId:null};
}
function renderPomoInline(sec){
  const p=state.pomo;if(!p)return;
  const mm=String(Math.floor(p.secondsLeft/60)).padStart(2,'0');
  const ss=String(p.secondsLeft%60).padStart(2,'0');
  const modeLabel={work:'🍅 Ish vaqti',short:'☕ Qisqa dam',long:'😴 Uzoq dam'}[p.mode]||'';
  const cls=p.mode!=='work'?'break':p.running?'running':'';
  const inline=el(`<div class="pomo-inline${cls?' '+cls:''}">
    <div class="pomo-info">
      <div class="pomo-mode-mini">${modeLabel}</div>
      <div class="pomo-time-mini">${mm}:${ss}</div>
    </div>
    <button class="pomo-action" id="pomo-inline-pp" aria-label="${p.running?'Pauza':'Boshlash'}">${p.running?I.pause:I.play}</button>

  inline.querySelector('#pomo-inline-pp').onclick=e=>{e.stopPropagation();pomoToggle()};
  sec.appendChild(inline);
}

function openPomoFull(taskId){
  if(!state.pomo)initPomo();
  if(taskId)state.pomo.taskId=taskId;
  const p=state.pomo;
  const taskTitle=taskId?((state.data.tasks.find(t=>t.id===taskId)||{}).title||''):'';
  const content=el(`<div>
    <div class="modal-head" style="background:transparent;border:none;position:absolute;top:0;left:0;right:0;z-index:1">
      <button class="icon-btn" id="pomo-close" aria-label="Yopish" style="background:rgba(255,255,255,0.3)">${I.x}</button>
      <span></span>
    </div>
    <div class="pomo-screen">
      <div class="pomo-mode"></div>
      <div class="pomo-time"></div>
      <div class="pomo-task-label"></div>
      <div class="pomo-controls">
        <button class="pomo-btn" id="pomo-reset" aria-label="Qayta boshlash">${I.reset}</button>
        <button class="pomo-btn primary" id="pomo-pp" aria-label="Boshlash/Pauza">${I.play}</button>
        <button class="pomo-btn" id="pomo-skip" aria-label="O'tkazib yuborish">${I.chevR}</button>
      </div>
      <div class="pomo-session-dots"></div>
      <div style="margin-top:28px;width:100%;max-width:260px">
        <div style="font-size:12px;opacity:0.7;margin-bottom:8px;text-align:center">Sozlamalar (daqiqa)</div>

          <label style="font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0.8">☕<input type="number" id="pomo-short-min" min="1" max="30" style="width:50px;text-align:center;border-radius:8px;border:1px solid rgba(0,0,0,0.2);padding:4px;font-size:14px;background:rgba(255,255,255,0.5)"></label>

        </div>
      </div>
    </div>
  </div>`);
  const render=()=>{
    const mm=String(Math.floor(p.secondsLeft/60)).padStart(2,'0');
    const ss=String(p.secondsLeft%60).padStart(2,'0');
    const modeLabel={work:'🍅 Ish vaqti',short:'☕ Qisqa dam',long:'😴 Uzoq dam'}[p.mode]||'';
    const bg={work:'linear-gradient(180deg,#FEF3C7 0%,#FCD34D 100%)',short:'linear-gradient(180deg,#DBEAFE 0%,#93C5FD 100%)',long:'linear-gradient(180deg,#EDE9FE 0%,#C4B5FD 100%)'}[p.mode];
    const fc={work:'#78350F',short:'#1E3A8A',long:'#4C1D95'}[p.mode];

    const ppBtn=content.querySelector('#pomo-pp');
    ppBtn.innerHTML=p.running?I.pause:I.play;
    ppBtn.style.background=fc;ppBtn.style.color='white';
    // Settings values
    if(content.querySelector('#pomo-work-min'))content.querySelector('#pomo-work-min').value=state.data.pomodoro.workMin;
    if(content.querySelector('#pomo-short-min'))content.querySelector('#pomo-short-min').value=state.data.pomodoro.shortBreakMin;
    if(content.querySelector('#pomo-long-min'))content.querySelector('#pomo-long-min').value=state.data.pomodoro.longBreakMin;
  };
  render();
  const bd=openSheet(content,{full:true});
  content.querySelector('#pomo-close').onclick=closeSheet;
  content.querySelector('#pomo-pp').onclick=()=>{pomoToggle();render()};
  content.querySelector('#pomo-reset').onclick=()=>{pomoReset();render()};
  content.querySelector('#pomo-skip').onclick=()=>{pomoSkip();render()};
  // Settings inputs
  ['pomo-work-min','pomo-short-min','pomo-long-min'].forEach(id=>{
    content.querySelector('#'+id).onchange=e=>{
      const v=parseInt(e.target.value)||1;
      if(id==='pomo-work-min'){state.data.pomodoro.workMin=v;if(p.mode==='work')p.secondsLeft=v*60}
      if(id==='pomo-short-min'){state.data.pomodoro.shortBreakMin=v;if(p.mode==='short')p.secondsLeft=v*60}
      if(id==='pomo-long-min'){state.data.pomodoro.longBreakMin=v;if(p.mode==='long')p.secondsLeft=v*60}
      saveState();render();
    };
  });
  // Live update in modal
  const liveInterval=setInterval(()=>{if(bd.parentNode)render();else clearInterval(liveInterval)},500);
}

function pomoToggle(){
  if(!state.pomo)initPomo();
  const p=state.pomo;
  if(p.running){
    clearInterval(p.intervalId);p.running=false;
  } else {
    p.running=true;
    p.intervalId=setInterval(()=>{
      p.secondsLeft--;
      if(p.secondsLeft<=0)pomoComplete();
      renderPomoUpdate();
    },1000);
  }
}
function pomoReset(){
  if(!state.pomo)return;const p=state.pomo;
  clearInterval(p.intervalId);p.running=false;p.mode='work';p.secondsLeft=state.data.pomodoro.workMin*60;renderPomoUpdate();
}
function pomoSkip(){
  if(!state.pomo)return;const p=state.pomo;
  clearInterval(p.intervalId);p.running=false;
  const pd=state.data.pomodoro;
  if(p.mode==='work'){p.sessionCount++;p.mode=(p.sessionCount%4===0)?'long':'short';p.secondsLeft=(p.sessionCount%4===0)?pd.longBreakMin*60:pd.shortBreakMin*60}
  else{p.mode='work';p.secondsLeft=pd.workMin*60}
  renderPomoUpdate();
}
function pomoComplete(){
  const p=state.pomo;clearInterval(p.intervalId);p.running=false;
  const pd=state.data.pomodoro;
  if(p.mode==='work'){
    pd.sessions.push({date:todayKey(),minutes:pd.workMin,taskId:p.taskId||null,completedAt:new Date().toISOString()});
    saveState();
    p.sessionCount++;p.mode=(p.sessionCount%4===0)?'long':'short';p.secondsLeft=(p.sessionCount%4===0)?pd.longBreakMin*60:pd.shortBreakMin*60;
    pomoDing();vibrate([200,100,200]);
    sendNotif('Pomodoro tugadi! 🍅','Yaxshi ish! Dam olish vaqti.');
  } else {
    p.mode='work';p.secondsLeft=pd.workMin*60;
    pomoDing();vibrate([100,50,100]);
    sendNotif('Dam olish tugadi ☕','Ish vaqti boshlandi!');
  }
  renderPomoUpdate();
}
function pomoDing(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.frequency.value=880;osc.type='sine';
    gain.gain.setValueAtTime(0.5,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.2);
    osc.start();osc.stop(ctx.currentTime+1.2);
  }catch(e){}
}
function renderPomoUpdate(){
  if(state.currentView==='tasks')renderTasks();
}

// === NOTIFICATIONS ===
function requestNotifPermission(){
  if(!('Notification' in window))return;
  Notification.requestPermission().then(p=>{
    state.data.settings.notificationsEnabled=(p==='granted');
    saveState();
    if(p==='granted')showToast('Eslatmalar yoqildi! 🔔');
    else showToast('Eslatmalar ruxsat etilmadi');
  });
}
function sendNotif(title,body){
  if(Notification.permission==='granted'){
    try{new Notification(title,{body,icon:"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563EB'/><path d='M28 52 L44 68 L74 36' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>"})}catch(e){}
  }
}

// === EXPORT / IMPORT ===
function exportData(){
  const json=JSON.stringify(state.data,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download=`kayzen-backup-${todayKey()}.json`;a.click();
  URL.revokeObjectURL(url);
  state.data.settings.lastBackupAt=new Date().toISOString();saveState();
  showToast('Backup yuklab olindi ✓');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.version||!d.tasks)return showToast('Noto\'g\'ri fayl formati');
        if(!confirm('Eski ma\'lumotlar ustiga yoziladi. Davom etamizmi?'))return;
        state.data=d;saveState();renderCurrentView();showToast('Import muvaffaqiyatli ✓');
      }catch(err){showToast('Faylni o\'qishda xatolik')}
    };reader.readAsText(file);
  };inp.click();
}

function openAppSettings(){
  const d=state.data;
  const lastBackup=d.settings.lastBackupAt?new Date(d.settings.lastBackupAt).toLocaleDateString('uz'):'Hech qachon';
  const content=el(`<div>
    <div class="modal-head"><span class="modal-title">Sozlamalar</span><button class="icon-btn" id="as-close">${I.x}</button></div>
    <div class="modal-body">
      <div class="settings-row">
        <div><div class="s-label">Eslatmalar</div><div class="s-desc">Deadline va pomodoro eslatmalari</div></div>
        <button class="toggle${d.settings.notificationsEnabled?' on':''}" id="notif-toggle" aria-label="Eslatmalar toggle"></button>
      </div>
      <div class="settings-row">
        <div><div class="s-label">Telegram Profil</div><div class="s-desc">Joriy qurilmadan profilingizni o'chirish</div></div>
        <button class="btn btn-danger" id="as-logout" style="padding:6px 12px;min-height:36px">Chiqish</button>
      </div>
      <div class="settings-row">
        <div><div class="s-label">Ma'lumotlarni eksport qilish</div><div class="s-desc">Oxirgi backup: ${lastBackup}</div></div>
        <button class="btn btn-secondary" id="as-export" style="gap:6px;padding:8px 12px;min-height:36px">${I.download} Eksport</button>
      </div>
      <div class="settings-row">
        <div><div class="s-label">Import qilish</div><div class="s-desc">JSON backup fayldan tiklash</div></div>
        <button class="btn btn-secondary" id="as-import" style="gap:6px;padding:8px 12px;min-height:36px">${I.upload} Import</button>
      </div>
      <div style="padding:12px 4px;font-size:12px;color:var(--text-muted)">Versiya: 1.0 · Ma'lumotlar faqat brauzerda saqlanadi</div>
    </div>
  </div>`);
  const bd=openSheet(content);
  content.querySelector('#as-close').onclick=closeSheet;
  const notifToggle=content.querySelector('#notif-toggle');
  notifToggle.onclick=()=>{
    if(!d.settings.notificationsEnabled){requestNotifPermission()}
    else{d.settings.notificationsEnabled=false;saveState();notifToggle.classList.remove('on')}
  };
  content.querySelector('#as-export').onclick=()=>{exportData();closeSheet()};
  content.querySelector('#as-import').onclick=()=>{importData();closeSheet()};
  content.querySelector('#as-logout').onclick=()=>{
    if(confirm('Profildan chiqmoqchimisiz? Ma\'lumotlaringiz qurilmadan o\'chiriladi.')) {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem('kayzen_sync_key');
      location.reload();
    }
  };
}

// === PWA ===
function setupPWA(){
  // Manifest inline
  const manifest={
    name:'Kayzen — Samaradorlik',short_name:'Kayzen',
    start_url:'.',display:'standalone',
    background_color:'#FAFAF9',theme_color:'#FAFAF9',
    icons:[
      {src:"data:image/svg+xml;base64,"+btoa(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='#2563EB'/><path d='M54 100 L86 132 L142 72' stroke='white' stroke-width='20' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>`),sizes:'192x192',type:'image/svg+xml'},
      {src:"data:image/svg+xml;base64,"+btoa(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='#2563EB'/><path d='M144 264 L232 352 L380 192' stroke='white' stroke-width='52' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>`),sizes:'512x512',type:'image/svg+xml'},
    ]
  };
  const link=document.getElementById('pwa-manifest');
  link.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(manifest));

  // Service Worker via blob
  const swCode=`
    const CACHE='kayzen-v1';
    self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./','/index.html']))));
    self.addEventListener('fetch',e=>{
      if(e.request.url.includes('chart.js'))return;
      e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./'))));
    });
  `;
  const blob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(blob);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }
}

// === BACKUP REMINDER ===
function checkBackupReminder(){
  const d=state.data.settings;
  if(!d.lastBackupAt)return;
  const last=new Date(d.lastBackupAt);const diff=(Date.now()-last)/(1000*3600*24);
  if(diff>=14)showToast('Backup yuklab olish vaqti keldi 💾','Yuklab olish',()=>exportData());
}

// === AUTH & INIT ===
async function onTelegramAuth(user) {
  if(!user || !user.id) return;
  AUTH_KEY = 'tg-' + user.id;
  localStorage.setItem('kayzen_sync_key', AUTH_KEY);
  showToast('☁️ Ma\'lumotlar yuklanmoqda...');
  
  const hasCloudData = await pullFromCloud(true);
  if(!hasCloudData) saveState(true);
  initApp();
}

function showLoginScreen() {
  $('#app').style.display = 'none';
  $('#splash-screen').style.display = 'flex';
  
  const container = $('#tg-widget-container');
  if(!container.innerHTML) {
    const script = document.createElement('script');
    script.src = 'https://telegram.org/js/telegram-widget.js?22';
    script.setAttribute('data-telegram-login', 'kayzen_samaradorlik_bot');
    script.setAttribute('data-size', 'large');
    script.setAttribute('data-onauth', 'onTelegramAuth(user)');
    script.setAttribute('data-request-access', 'write');
    container.appendChild(script);
  }
}

function initApp() {
  $('#splash-screen').style.display = 'none';
  $('#app').style.display = 'block';
  
  // Eski checklistni yangisiga ko'chirish
  if (state.data.checklist.items.length === 14 && state.data.checklist.items[0].name === 'Bomdodga turish') {
    state.data.checklist.items = DEFAULT_HABITS.map((h,i)=>({id:uid(),emoji:h.emoji,name:h.name,order:i}));
    saveState();
  }
  
  setupPWA();
  // Bottom nav
  $$('.tab').forEach(btn=>{
    btn.onclick=()=>{switchView(btn.dataset.view);vibrate(8)};
  });
  // FAB
  $('#fab').onclick=()=>{
    const v=state.currentView;
    if(v==='tasks')openAddTask();
    else if(v==='plans')openGoalEdit(state.planKind||'weekly', state.planKey||weekKey(new Date()), null);
    else if(v==='checklist')openHabitSettings();
    else if(v==='kayzen'){}
  };
  // Keyboard shortcuts
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')closeSheet();
  });
  
  // Live Sync - Ilovaga qaytilganda (backgrounddan foregroundga)
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && AUTH_KEY) {
      pullFromCloud(false); // faqat o'zgargan bo'lsa tortamiz
    }
  });
  
  updateTopbar();
  renderCurrentView();
  checkBackupReminder();
}

async function init(){
  // Check Telegram Mini App user
  const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
  if(tgUser && tgUser.id) {
    AUTH_KEY = 'tg-' + tgUser.id;
    localStorage.setItem('kayzen_sync_key', AUTH_KEY);
  }

  // Check if logged in
  if(AUTH_KEY) {
    // Ilovani ochishdan oldin majburiy bulutdan ma'lumotlarni tekshiramiz
    $('#splash-screen').innerHTML = '<h3 style="margin-top:40vh;color:var(--accent)">☁️ Yuklanmoqda...</h3>';
    $('#splash-screen').style.display = 'block';
    
    await pullFromCloud(false);
    initApp();
  } else {
    showLoginScreen();
  }
}

init();
</script>
